<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day-10-JS-POST</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="main-wrapper container my-5">
      <h1>POST a New Post using <code>XMLHttpRequest</code></h1>
      <form id="post-form" class="crud-form">
        <input type="text" id="post-title" placeholder="Title" required />
        <textarea id="post-body" placeholder="Body" required></textarea>
        <button type="submit">Create Post</button>
      </form>
      <div id="postResult"></div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
